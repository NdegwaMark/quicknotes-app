<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header>
    <h1>QuickNotes</h1>
    <p>Your quick and simple note-taking app</p>
  </header>

  <main>
    <section aria-labelledby="add-note-heading">
      <h2 id="add-note-heading">Add a note</h2>
      <form id="note-form">
        <label for="note-input">Note text</label>
        <input type="text" id="note-input" placeholder="Type your note here...">
        <label for="note-category">Category</label>
        <select id="note-category">
          <option value="Personal">Personal</option>
          <option value="Work">Work</option>
          <option value="Study">Study</option>
        </select>
        <button type="submit">Add Note</button>
      </form>
      <p id="error-message"></p>
      <button type="button" id="clear-all">Clear all</button>
    </section>

    <section aria-labelledby="notes-heading">
      <h2 id="notes-heading">Your notes</h2>
      <input type="text" id="search-input" placeholder="Search notes...">
      <p id="note-count"></p>
      <ul id="notes-list"></ul>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 QuickNotes. Built with HTML, CSS and JavaScript.</p>
  </footer>
</body>
</html>
